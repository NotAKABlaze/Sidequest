<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Code Breaker</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:2rem;font-weight:800;letter-spacing:3px;margin-top:6px;color:#ffffff;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
input[type=range]{width:100%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
.cipher-text{font-family:monospace;font-size:1.3rem;letter-spacing:2px;background:#374151;padding:14px;border-radius:10px;text-align:center;margin-bottom:10px;word-break:break-word;}
.preview-text{font-family:monospace;font-size:1.1rem;letter-spacing:1px;background:#0b1220;padding:12px;border-radius:10px;text-align:center;margin-bottom:14px;color:var(--accent);word-break:break-word;min-height:1.4em;}
.peg-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.slot{width:42px;height:42px;border-radius:50%;cursor:pointer;border:3px solid #4b5563;}
.feedback{display:flex;gap:4px;margin-left:8px;}
.fbdot{width:10px;height:10px;border-radius:50%;}
.opt-btn{display:block;width:100%;text-align:left;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Code Breaker</h1>
  <div class="sub">Crack the 4-peg color code in 8 tries or fewer</div>
  <div id="game">
<div id="slots" class="peg-row"></div>
<button id="guessBtn">Submit Guess</button>
<div style="margin-top:6px;font-size:.8rem;color:var(--muted);">⬤ black = right color &amp; spot &nbsp; ○ white = right color, wrong spot</div>
<div id="history" style="margin-top:14px;"></div>
<div>Guesses: <span id="attemptCount">0</span>/8</div>
</div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Completion Code</div>
    <div class="code">MIND-2951</div>
    <div class="footer-note">Show this screen at the sidequest booth</div>
  </div>
</div>
<script>
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

const colors = ['#f87171','#34d399','#60a5fa','#fbbf24','#a78bfa','#fb923c'];
const secret = Array.from({length:4}, ()=>colors[Math.floor(Math.random()*colors.length)]);
let current = [colors[0],colors[0],colors[0],colors[0]];
let attempts = 0;
const maxAttempts = 8;
const slotsDiv = document.getElementById('slots');
function renderSlots(){
  slotsDiv.innerHTML = '';
  current.forEach((c,i)=>{
    const s = document.createElement('div');
    s.className = 'slot';
    s.style.background = c;
    s.onclick = ()=>{
      const idx = colors.indexOf(current[i]);
      current[i] = colors[(idx+1)%colors.length];
      renderSlots();
    };
    slotsDiv.appendChild(s);
  });
}
renderSlots();
document.getElementById('guessBtn').onclick = ()=>{
  if(attempts>=maxAttempts) return;
  attempts++;
  document.getElementById('attemptCount').textContent = attempts;
  const secretCopy = [...secret], guessCopy = [...current];
  let black = 0;
  for(let i=0;i<4;i++){
    if(guessCopy[i]===secretCopy[i]){ black++; secretCopy[i]=null; guessCopy[i]='X'; }
  }
  let white = 0;
  for(let i=0;i<4;i++){
    if(guessCopy[i]==='X') continue;
    const idx = secretCopy.indexOf(guessCopy[i]);
    if(idx!==-1){ white++; secretCopy[idx]=null; }
  }
  const row = document.createElement('div');
  row.className = 'peg-row';
  current.forEach(c=>{
    const dot = document.createElement('div');
    dot.style.width='24px'; dot.style.height='24px'; dot.style.borderRadius='50%'; dot.style.background=c;
    row.appendChild(dot);
  });
  const fb = document.createElement('div');
  fb.className = 'feedback';
  for(let i=0;i<black;i++){ const d=document.createElement('div'); d.className='fbdot'; d.style.background='#111827'; fb.appendChild(d); }
  for(let i=0;i<white;i++){ const d=document.createElement('div'); d.className='fbdot'; d.style.background='#e5e7eb'; fb.appendChild(d); }
  row.appendChild(fb);
  document.getElementById('history').prepend(row);
  if(black===4){
    document.getElementById('msg').innerHTML = '<span class="good">Code cracked!</span>';
    unlock();
  } else if(attempts>=maxAttempts){
    document.getElementById('msg').innerHTML = '<span class="bad">Out of guesses — reload to retry.</span>';
    document.getElementById('guessBtn').disabled = true;
  }
};

</script>
</body>
</html>
