<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Pattern Memory</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.tile{background:#374151;border-radius:10px;transition:.15s;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:1.5rem;font-weight:800;letter-spacing:.5px;margin-top:6px;color:#ffffff;line-height:1.3;}
.grid{display:grid;gap:8px;margin:16px 0;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
.bar{height:14px;background:#374151;border-radius:7px;overflow:hidden;margin:10px 0;}
.bar > div{height:100%;background:var(--accent);width:0%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Pattern Memory</h1>
  <div class="sub">Function Room &middot; Watch the pattern, then repeat it (5 in a row)</div>
  <div id="game">
<div class="grid" style="grid-template-columns:1fr 1fr;">
  <div class="tile" data-i="0" style="height:80px;background:#f87171;"></div>
  <div class="tile" data-i="1" style="height:80px;background:#34d399;"></div>
  <div class="tile" data-i="2" style="height:80px;background:#60a5fa;"></div>
  <div class="tile" data-i="3" style="height:80px;background:#fbbf24;"></div>
</div>
<button id="startBtn">Start</button>
</div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Answer</div>
    <div class="code">Function Room (6th Floor)</div>
    <div class="footer-note">Go take a selfie at this location and come back to the sidequest booth</div>
  </div>
</div>
<script>
const CODE = "Function Room (6th Floor)";
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

const tiles = document.querySelectorAll('.tile');
let seq=[], userSeq=[], level=0;
function flash(i){
  return new Promise(res=>{
    tiles[i].style.filter='brightness(2)';
    setTimeout(()=>{ tiles[i].style.filter=''; res(); }, 400);
  });
}
async function playSeq(){
  document.getElementById('msg').textContent='Watch...';
  for(const i of seq){ await flash(i); await new Promise(r=>setTimeout(r,200)); }
  document.getElementById('msg').textContent='Your turn — repeat it';
  userSeq=[];
}
function nextLevel(){
  level++;
  seq.push(Math.floor(Math.random()*4));
  setTimeout(playSeq, 600);
}
document.getElementById('startBtn').onclick = ()=>{ seq=[]; level=0; nextLevel(); };
tiles.forEach(t=>t.onclick=()=>{
  const i = parseInt(t.getAttribute('data-i'));
  flash(i);
  userSeq.push(i);
  const idx = userSeq.length-1;
  if(userSeq[idx] !== seq[idx]){
    document.getElementById('msg').innerHTML = '<span class="bad">Wrong! Restarting.</span>';
    seq=[]; level=0; setTimeout(nextLevel, 1000);
    return;
  }
  if(userSeq.length === seq.length){
    if(level>=5){ document.getElementById('msg').innerHTML='<span class="good">Pattern mastered!</span>'; unlock(); }
    else { setTimeout(nextLevel, 800); }
  }
});

</script>
</body>
</html>
