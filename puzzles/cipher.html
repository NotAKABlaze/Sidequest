<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ Picture Logic</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:2rem;font-weight:800;letter-spacing:3px;margin-top:6px;color:#ffffff;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
input[type=range]{width:100%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
.cipher-text{font-family:monospace;font-size:1.3rem;letter-spacing:2px;background:#374151;padding:14px;border-radius:10px;text-align:center;margin-bottom:10px;word-break:break-word;}
.preview-text{font-family:monospace;font-size:1.1rem;letter-spacing:1px;background:#0b1220;padding:12px;border-radius:10px;text-align:center;margin-bottom:14px;color:var(--accent);word-break:break-word;min-height:1.4em;}
.peg-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.slot{width:42px;height:42px;border-radius:50%;cursor:pointer;border:3px solid #4b5563;}
.feedback{display:flex;gap:4px;margin-left:8px;}
.fbdot{width:10px;height:10px;border-radius:50%;}
.opt-btn{display:block;width:100%;text-align:left;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Picture Logic</h1>
  <div class="sub">Use the row and column numbers to fill in the hidden picture</div>
  <div id="game">
<div id="nonoWrap" style="display:flex;justify-content:center;"></div>
<div style="margin-top:14px;text-align:center;"><button id="checkBtn">Check Picture</button></div>
</div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Completion Code</div>
    <div class="code">PICS-4417</div>
    <div class="footer-note">Show this screen at the sidequest booth</div>
  </div>
</div>
<script>
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

// each pattern is 8 rows of an 8-character string of 0/1 — more distinct, asymmetric pictures
const patternPool = [
  ["00011100","00001100","00011000","00110000","01111110","00011000","00110000","01100000"], // lightning bolt
  ["00011000","00111100","00011000","00011000","01111110","10011001","11011011","01111110"], // anchor
  ["00000110","00000101","00000101","00000101","00111101","01100001","11100011","01111110"], // musical note
  ["11111111","10000001","11000011","10100101","10011001","10000001","10000001","11111111"], // envelope
  ["10001001","11011011","11111111","01111110","01111110","00111100","00111100","00011000"], // crown
  ["00110110","00110110","00000000","01111110","11111111","11111111","01111110","00000000"]  // paw print
];
const target = patternPool[Math.floor(Math.random()*patternPool.length)].map(row => row.split('').map(ch=>ch==='1'));
const SIZE = 8;
const CELL = 34;

function runClues(line){
  const clues = [];
  let count = 0;
  for(const cell of line){
    if(cell){ count++; } else { if(count>0){ clues.push(count); count=0; } }
  }
  if(count>0) clues.push(count);
  return clues.length ? clues : [0];
}
const rowClues = target.map(row => runClues(row));
const colClues = [];
for(let c=0;c<SIZE;c++){
  const col = target.map(row => row[c]);
  colClues.push(runClues(col));
}

let playerGrid = Array.from({length:SIZE}, () => Array(SIZE).fill(false));

const wrap = document.getElementById('nonoWrap');
const ROWLABEL = 46;
function render(){
  wrap.innerHTML = '';
  const table = document.createElement('div');
  table.style.display = 'inline-block';

  // column clue header row
  const maxColClueLen = Math.max(...colClues.map(c=>c.length));
  const headerRow = document.createElement('div');
  headerRow.style.display = 'flex';
  const corner = document.createElement('div');
  corner.style.width = ROWLABEL+'px'; corner.style.height = (maxColClueLen*15+8)+'px';
  headerRow.appendChild(corner);
  colClues.forEach(clue=>{
    const cell = document.createElement('div');
    cell.style.width = CELL+'px';
    cell.style.display = 'flex'; cell.style.flexDirection='column'; cell.style.justifyContent='flex-end'; cell.style.alignItems='center';
    cell.style.fontSize = '.7rem'; cell.style.color = 'var(--muted)'; cell.style.lineHeight='1.15';
    clue.forEach(n=>{ const d=document.createElement('div'); d.textContent=n; cell.appendChild(d); });
    headerRow.appendChild(cell);
  });
  table.appendChild(headerRow);

  target.forEach((rowArr,r)=>{
    const rowDiv = document.createElement('div');
    rowDiv.style.display = 'flex';
    const clueCell = document.createElement('div');
    clueCell.style.width = ROWLABEL+'px'; clueCell.style.display='flex'; clueCell.style.alignItems='center'; clueCell.style.justifyContent='flex-end';
    clueCell.style.paddingRight='6px'; clueCell.style.fontSize='.7rem'; clueCell.style.color='var(--muted)';
    clueCell.textContent = rowClues[r].join(' ');
    rowDiv.appendChild(clueCell);
    for(let c=0;c<SIZE;c++){
      const cell = document.createElement('div');
      cell.style.width=CELL+'px'; cell.style.height=CELL+'px'; cell.style.border='1px solid #4b5563';
      cell.style.background = playerGrid[r][c] ? 'var(--accent)' : '#374151';
      cell.style.cursor = 'pointer';
      cell.onclick = ()=>{
        playerGrid[r][c] = !playerGrid[r][c];
        render();
      };
      rowDiv.appendChild(cell);
    }
    table.appendChild(rowDiv);
  });
  wrap.appendChild(table);
}
render();

document.getElementById('checkBtn').onclick = ()=>{
  const matches = target.every((row,r)=>row.every((v,c)=>v===playerGrid[r][c]));
  if(matches){
    document.getElementById('msg').innerHTML = '<span class="good">Picture complete!</span>';
    unlock();
  } else {
    document.getElementById('msg').innerHTML = '<span class="bad">Not quite — check the row and column numbers again.</span>';
  }
};

</script>
</body>
</html>
