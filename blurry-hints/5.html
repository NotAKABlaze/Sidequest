<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blurry Image 5</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
.photo{width:100%;border-radius:14px;display:block;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.timerbox{text-align:center;background:#374151;border-radius:14px;padding:16px;margin-bottom:6px;}
.timerbox .label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px;}
.timerbox .count{font-size:2.2rem;font-weight:800;color:var(--accent);margin-top:4px;}
.codebox{display:none;margin-top:16px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:1.6rem;font-weight:800;margin-top:6px;color:#ffffff;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 Guess the Floor</h1>
  <div class="sub">Blurry Image #5 &middot; Where was this taken?</div>
  <img class="photo" src="img/5.jpg" alt="Blurry photo 5">
  <div class="timerbox" id="timerbox">
    <div class="label">Hint reveals in</div>
    <div class="count" id="count">60</div>
  </div>
  <div class="codebox" id="codebox">
    <div class="label">Hint</div>
    <div class="code">This was taken on the 3rd Floor</div>
  </div>
  <div class="footer-note">Head to that floor to keep going</div>
</div>
<script>
let t = 60;
const countEl = document.getElementById('count');
const timer = setInterval(()=>{
  t--;
  countEl.textContent = t;
  if(t<=0){
    clearInterval(timer);
    document.getElementById('timerbox').style.display='none';
    document.getElementById('codebox').classList.add('show');
  }
}, 1000);
</script>
</body>
</html>
