<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 Math Sprint</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.tile{background:#374151;border-radius:10px;transition:.15s;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:1.5rem;font-weight:800;letter-spacing:.5px;margin-top:6px;color:#ffffff;line-height:1.3;}
.grid{display:grid;gap:8px;margin:16px 0;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
.bar{height:14px;background:#374151;border-radius:7px;overflow:hidden;margin:10px 0;}
.bar > div{height:100%;background:var(--accent);width:0%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔢 Math Sprint</h1>
  <div class="sub">Block 19 &middot; Answer 5 quick sums correctly within 20 seconds (4/5 needed)</div>
  <div id="game"><div style="margin-bottom:8px;">Time left: <span id="timerDisplay">20</span>s</div>
<div id="q" style="font-size:1.6rem;font-weight:700;margin-bottom:12px;"></div>
<input type="text" id="ans" placeholder="Answer">
<div style="margin-top:12px;"><button id="submitBtn">Submit</button></div></div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Answer</div>
    <div class="code">Block 19</div>
    <div class="footer-note">Show this screen to the event organizer</div>
  </div>
</div>
<script>
const CODE = "Block 19";
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

let qnum=0, correct=0;
const total=5;
let currentAns=0;
const ansInput = document.getElementById('ans');
const submitBtn = document.getElementById('submitBtn');
const timerEl = document.getElementById('timerDisplay');
let timeLeft = 20;
let timeUp = false;
const mathTimer = setInterval(()=>{
  timeLeft--;
  timerEl.textContent = timeLeft;
  if(timeLeft<=0){
    clearInterval(mathTimer);
    timeUp = true;
    ansInput.disabled = true; submitBtn.disabled = true;
    document.getElementById('msg').innerHTML = `<span class="bad">Time's up! ${correct}/${qnum} correct — reload to retry.</span>`;
  }
}, 1000);
function genQ(){
  const ops=['+','-','x','÷']; const op=ops[Math.floor(Math.random()*4)];
  let a,b,ans;
  if(op==='+'){ a=Math.floor(Math.random()*30)+1; b=Math.floor(Math.random()*30)+1; ans=a+b; }
  else if(op==='-'){ a=Math.floor(Math.random()*30)+10; b=Math.floor(Math.random()*a); ans=a-b; }
  else if(op==='x'){ a=Math.floor(Math.random()*12)+1; b=Math.floor(Math.random()*12)+1; ans=a*b; }
  else { b=Math.floor(Math.random()*10)+2; ans=Math.floor(Math.random()*12)+1; a=b*ans; }
  currentAns=ans;
  document.getElementById('q').textContent = `${a} ${op} ${b} = ?`;
}
genQ();
submitBtn.onclick = ()=>{
  if(timeUp) return;
  const val = parseInt(document.getElementById('ans').value);
  qnum++;
  if(val===currentAns) correct++;
  document.getElementById('ans').value='';
  if(qnum>=total){
    if(correct>=4){ clearInterval(mathTimer); document.getElementById('msg').innerHTML=`<span class="good">${correct}/${total} correct!</span>`; unlock(); }
    else { document.getElementById('msg').innerHTML=`<span class="bad">${correct}/${total} — try again.</span>`; qnum=0; correct=0; genQ(); }
  } else { genQ(); }
};

</script>
</body>
</html>
