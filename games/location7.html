<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👻 Vanishing Tic-Tac-Toe</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.tile{background:#374151;border-radius:10px;transition:.15s;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:1.5rem;font-weight:800;letter-spacing:.5px;margin-top:6px;color:#ffffff;line-height:1.3;}
.grid{display:grid;gap:8px;margin:16px 0;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
.bar{height:14px;background:#374151;border-radius:7px;overflow:hidden;margin:10px 0;}
.bar > div{height:100%;background:var(--accent);width:0%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>👻 Vanishing Tic-Tac-Toe</h1>
  <div class="sub">Each player can only have 3 marks on the board — placing a 4th vanishes your oldest</div>
  <div id="game">
<div class="grid" id="tttBoard" style="grid-template-columns:repeat(3,1fr);width:210px;margin:0 auto;"></div>
<div style="margin-top:14px;text-align:center;"><button id="tttReset" style="display:none;background:#4b5563;color:#f9fafb;">Play Again</button></div>
</div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Answer</div>
    <div class="code">Career Centre (Ground Floor)</div>
    <div class="footer-note">Go take a selfie at this location and come back to the sidequest booth</div>
  </div>
</div>
<script>
const CODE = "Career Centre (Ground Floor)";
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

let board = Array(9).fill(null); // each cell: null or {p:'X'|'O'}
let xQueue = [], oQueue = []; // indices in placement order, oldest first
let gameOver = false;
const boardDiv = document.getElementById('tttBoard');
const resetBtn = document.getElementById('tttReset');
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function queueFor(player){ return player==='X' ? xQueue : oQueue; }

function placeMark(i, player){
  const queue = queueFor(player);
  queue.push(i);
  if(queue.length>3){
    const oldest = queue.shift();
    board[oldest] = null;
  }
  board[i] = {p:player};
}

// place, check outcome, then fully revert — used for AI lookahead
function tentativePlace(i, player){
  const queue = queueFor(player);
  queue.push(i);
  let evicted = null;
  if(queue.length>3){ evicted = queue.shift(); board[evicted]=null; }
  board[i] = {p:player};
  return evicted;
}
function undoTentative(i, player, evicted){
  const queue = queueFor(player);
  queue.pop();
  board[i] = null;
  if(evicted!==null){
    queue.unshift(evicted);
    board[evicted] = {p:player};
  }
}

function ageOf(i, player){
  const queue = queueFor(player);
  const pos = queue.indexOf(i);
  return (queue.length-1) - pos; // 0 = newest, higher = older (about to vanish)
}

function checkWinner(){
  for(const [a,c,d] of lines){
    if(board[a] && board[c] && board[d] && board[a].p===board[c].p && board[a].p===board[d].p) return board[a].p;
  }
  return null;
}

function computerMove(){
  const empty = board.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(empty.length===0) return null;
  for(const i of empty){
    const ev = tentativePlace(i,'O');
    const win = checkWinner()==='O';
    undoTentative(i,'O',ev);
    if(win) return i;
  }
  for(const i of empty){
    const ev = tentativePlace(i,'X');
    const win = checkWinner()==='X';
    undoTentative(i,'X',ev);
    if(win) return i;
  }
  if(!board[4]) return 4;
  const corners = [0,2,6,8].filter(i=>!board[i]);
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  return empty[Math.floor(Math.random()*empty.length)];
}

function render(){
  boardDiv.innerHTML = '';
  board.forEach((cellData,i)=>{
    const cell = document.createElement('div');
    cell.className = 'tile';
    cell.style.height = '64px'; cell.style.display='flex'; cell.style.alignItems='center'; cell.style.justifyContent='center';
    cell.style.fontSize = '1.8rem'; cell.style.fontWeight='700';
    cell.style.cursor = (gameOver||cellData) ? 'default' : 'pointer';
    if(cellData){
      cell.textContent = cellData.p;
      cell.style.color = cellData.p==='X' ? '#22d3ee' : '#f472b6';
      const age = ageOf(i, cellData.p);
      const opacityByAge = [1, 0.6, 0.3];
      cell.style.opacity = opacityByAge[age] !== undefined ? opacityByAge[age] : 1;
    } else {
      cell.textContent = '';
    }
    cell.onclick = ()=>{
      if(gameOver || board[i]) return;
      placeMark(i, 'X');
      let result = checkWinner();
      if(!result){
        const compI = computerMove();
        if(compI!==null){
          placeMark(compI, 'O');
          result = checkWinner();
        }
      }
      render();
      if(result){
        gameOver = true;
        resetBtn.style.display = 'inline-block';
        if(result==='X'){ document.getElementById('msg').innerHTML='<span class="good">You won!</span>'; unlock(); }
        else { document.getElementById('msg').innerHTML='<span class="bad">Computer won this time.</span>'; }
      }
    };
    boardDiv.appendChild(cell);
  });
}
resetBtn.onclick = ()=>{
  board = Array(9).fill(null);
  xQueue = []; oQueue = [];
  gameOver = false;
  resetBtn.style.display = 'none';
  document.getElementById('msg').innerHTML = '';
  render();
};
render();

</script>
</body>
</html>
