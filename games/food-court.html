<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 Catch the Food</title>
<style>
:root{--bg:#111827;--card:#1f2937;--accent:#22d3ee;--accent2:#f472b6;--text:#f9fafb;--muted:#9ca3af;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:480px;width:100%;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
button{background:var(--accent);color:#111827;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;}
.tile{background:#374151;border-radius:10px;transition:.15s;}
.msg{margin-top:14px;font-size:.95rem;min-height:1.4em;}
.good{color:var(--good);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.codebox{display:none;margin-top:20px;text-align:center;background:#064e3b;border:2px solid var(--good);border-radius:14px;padding:20px;}
.codebox.show{display:block;}
.codebox .label{color:#a7f3d0;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.codebox .code{font-size:1.5rem;font-weight:800;letter-spacing:.5px;margin-top:6px;color:#ffffff;line-height:1.3;}
.grid{display:grid;gap:8px;margin:16px 0;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;font-size:1rem;background:#374151;color:var(--text);}
.bar{height:14px;background:#374151;border-radius:7px;overflow:hidden;margin:10px 0;}
.bar > div{height:100%;background:var(--accent);width:0%;}
.footer-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍔 Catch the Food</h1>
  <div class="sub">Food Court &middot; Drag your finger, use arrow keys, or the buttons — catch 10 items</div>
  <div id="game"><canvas id="catch" width="280" height="300" style="background:#374151;border-radius:10px;display:block;margin:0 auto;touch-action:none;"></canvas>
<div style="display:flex;gap:16px;justify-content:center;margin-top:10px;">
  <button id="foodLeft">◀ Left</button>
  <button id="foodRight">Right ▶</button>
</div>
<div style="margin-top:10px;">Caught: <span id="caught">0</span>/10</div></div>
  <div class="msg" id="msg"></div>
  <div class="codebox" id="codebox">
    <div class="label">Answer</div>
    <div class="code">Food Court</div>
    <div class="footer-note">Show this screen to the event organizer</div>
  </div>
</div>
<script>
const CODE = "Food Court";
function unlock(){
  document.getElementById('codebox').classList.add('show');
  document.getElementById('game').style.opacity = '0.4';
  document.getElementById('game').style.pointerEvents = 'none';
}

const canvas = document.getElementById('catch'); const ctx = canvas.getContext('2d');
let basketX=120, caught=0, item={x:Math.random()*250,y:0,e:'🍕'};
const emojis=['🍕','🍔','🍟','🍎','🍩'];
function newItem(){ item={x:Math.random()*250,y:0,e:emojis[Math.floor(Math.random()*emojis.length)]}; }
newItem();
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') basketX=Math.max(0,basketX-20);
  if(e.key==='ArrowRight') basketX=Math.min(240,basketX+20);
});
document.getElementById('foodLeft').onclick=()=>{ basketX=Math.max(0,basketX-30); };
document.getElementById('foodRight').onclick=()=>{ basketX=Math.min(240,basketX+30); };
function trackTouch(e){
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touchX = e.touches[0].clientX - rect.left;
  basketX = Math.max(0, Math.min(240, touchX - 20));
}
canvas.addEventListener('touchstart', trackTouch, {passive:false});
canvas.addEventListener('touchmove', trackTouch, {passive:false});
function loop(){
  ctx.clearRect(0,0,280,300);
  item.y+=3;
  ctx.font='28px sans-serif'; ctx.fillText(item.e, item.x, item.y);
  ctx.font='30px sans-serif'; ctx.fillText('🧺', basketX, 290);
  if(item.y>260 && item.y<300 && Math.abs(item.x-basketX)<30){
    caught++; document.getElementById('caught').textContent=caught;
    if(caught>=10){ document.getElementById('msg').innerHTML='<span class="good">Caught 10 items!</span>'; unlock(); return; }
    newItem();
  } else if(item.y>300){ newItem(); }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
